name: Update Leaderboard

on:
  repository_dispatch:
    types: [update-score] # Matches the 'event-type' sent by the student repo

permissions:
  contents: write # Required to push changes back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Leaderboard Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Leaderboard Data
        env:
          # We pass the entire JSON payload to the script as an environment variable
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python update_leaderboard.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "LeaderboardBot"
          git config --global user.email "bot@github.com"
          
          # Add the modified files
          git add README.md scores.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update score for ${{ github.event.client_payload.username }}"
            git push
          fi
