name: Update Scoreboard
on:
  repository_dispatch:
    types: [new_score]

permissions:
  contents: write  # Crucial for the Bot to push changes

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        env:
          # FIXED: Changed '照 json' to 'toJson'
          STUDENT_DATA: ${{ toJson(github.event.client_payload) }}
        run: python update_leaderboard.py

      - name: Commit and Push
        run: |
          git config --global user.name "ScoreBot"
          git config --global user.email "bot@github.com"
          git add README.md
          # Only commit if there are actually changes to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update score for ${{ github.event.client_payload.student }}" && git push)
